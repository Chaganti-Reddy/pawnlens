# Netlify deploy config. (Cloudflare Pages uses public/_redirects + dashboard settings.)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: serve index.html for client-side routes (/review, /train, …).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
